<html lang="vi"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI · CVNSS4.0</title>
<style>
  :root {
    --bg:        #0a0d14;
    --surface:   #111621;
    --surface-2: #161c2a;
    --line:      #1e2636;
    --line-2:    #2a3446;
    --text:      #e8edf5;
    --text-dim:  #8b96a8;
    --text-mute: #5b6577;
    --accent:    #4f8cff;
    --accent-2:  #3d7ae6;
    --accent-soft: rgba(79, 140, 255, 0.12);
    --code:      #7dd3fc;
    --warn:      #fbbf24;
    --danger:    #f87171;
    --success:   #34d399;
    --radius:    12px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ── App shell ─────────────────────────────────── */
  .app {
    height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr auto auto;
    max-width: 900px;
    margin: 0 auto;
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
    background: var(--surface);
  }

  /* ── Header ────────────────────────────────────── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
    gap: 12px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .logo-mark {
    width: 32px;
    height: 32px;
    border-radius: 9px;
    background: linear-gradient(135deg, var(--accent) 0%, #7c5cff 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    flex-shrink: 0;
    box-shadow: 0 4px 14px rgba(79, 140, 255, 0.25);
  }

  .logo-mark svg { width: 18px; height: 18px; }

  .logo-text {
    display: flex;
    flex-direction: column;
    gap: 1px;
    min-width: 0;
  }
  .logo-text .title {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .logo-text .subtitle {
    font-size: 11px;
    color: var(--text-mute);
    font-weight: 400;
    letter-spacing: 0.02em;
  }

  .controls {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .btn {
    height: 32px;
    padding: 0 12px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--line-2);
    background: var(--surface-2);
    color: var(--text-dim);
    font-size: 12px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s ease;
    white-space: nowrap;
    user-select: none;
  }
  .btn:hover { background: var(--line); color: var(--text); border-color: var(--line-2); }
  .btn:active { transform: scale(0.97); }

  .btn svg { width: 14px; height: 14px; flex-shrink: 0; }

  .btn.mode-auto    { color: var(--accent);  border-color: rgba(79, 140, 255, 0.35); background: var(--accent-soft); }
  .btn.mode-api     { color: var(--success); border-color: rgba(52, 211, 153, 0.3); background: rgba(52, 211, 153, 0.08); }
  .btn.mode-offline { color: var(--warn);    border-color: rgba(251, 191, 36, 0.3); background: rgba(251, 191, 36, 0.08); }

  /* ── Chat area ─────────────────────────────────── */
  .chat {
    overflow-y: auto;
    padding: 24px 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    scroll-behavior: smooth;
  }
  .chat::-webkit-scrollbar { width: 8px; }
  .chat::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  .chat::-webkit-scrollbar-thumb:hover { background: var(--line-2); }
  .chat::-webkit-scrollbar-track { background: transparent; }

  .msg {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-width: 88%;
    animation: fadeIn 0.25s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg.user      { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: flex-start; align-items: flex-start; width: 100%; max-width: 100%; }

  .msg .head {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-mute);
    letter-spacing: 0.03em;
    padding: 0 4px;
    text-transform: uppercase;
  }
  .msg .head svg { width: 12px; height: 12px; }

  .bubble {
    padding: 11px 15px;
    border-radius: var(--radius);
    font-size: 14px;
    white-space: pre-wrap;
    word-break: break-word;
    max-width: 100%;
  }
  .msg.user .bubble {
    background: linear-gradient(135deg, var(--accent) 0%, #5b7cff 100%);
    color: #fff;
    border-bottom-right-radius: 3px;
    box-shadow: 0 4px 12px rgba(79, 140, 255, 0.18);
  }
  .msg.assistant .bubble {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-bottom-left-radius: 3px;
    padding: 0;
    overflow: hidden;
    width: 100%;
  }

  /* ── Reasoning panel ──────────────────────────── */
  .reason {
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(125, 211, 252, 0.03), transparent);
  }
  .reason summary {
    cursor: pointer;
    padding: 10px 14px;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-dim);
    user-select: none;
    list-style: none;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.15s;
  }
  .reason summary:hover { background: rgba(255,255,255,0.02); }
  .reason summary::-webkit-details-marker { display: none; }

  .brain {
    width: 16px;
    height: 16px;
    color: var(--code);
    flex-shrink: 0;
    transition: all 0.3s ease;
  }
  .reason.streaming .brain {
    animation: brainPulse 1.6s ease-in-out infinite;
    filter: drop-shadow(0 0 6px rgba(125, 211, 252, 0.6));
  }
  .reason.done .brain { opacity: 0.55; }

  @keyframes brainPulse {
    0%, 100% { opacity: 1;   transform: scale(1); }
    50%      { opacity: 0.6; transform: scale(1.08); }
  }

  .reason summary .label { flex: 1; }

  .reason summary .chev {
    width: 12px;
    height: 12px;
    color: var(--text-mute);
    transition: transform 0.2s ease;
    flex-shrink: 0;
  }
  .reason[open] summary .chev { transform: rotate(90deg); }

  .reason summary .status {
    font-size: 10.5px;
    padding: 2px 7px;
    border-radius: 4px;
    background: rgba(125, 211, 252, 0.1);
    color: var(--code);
    font-weight: 500;
    letter-spacing: 0.02em;
  }
  .reason.streaming summary .status {
    background: rgba(125, 211, 252, 0.15);
    animation: statusPulse 1.6s ease-in-out infinite;
  }
  @keyframes statusPulse { 50% { opacity: 0.5; } }
  .reason.done summary .status {
    background: rgba(52, 211, 153, 0.1);
    color: var(--success);
  }

  .reason pre {
    margin: 0;
    padding: 12px 14px 14px;
    font-family: 'SF Mono', 'JetBrains Mono', 'Consolas', 'Monaco', monospace;
    font-size: 12px;
    line-height: 1.65;
    color: var(--code);
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 300px;
    overflow-y: auto;
    background: rgba(0,0,0,0.25);
    border-top: 1px solid var(--line);
  }
  .reason pre::-webkit-scrollbar { width: 6px; }
  .reason pre::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 3px; }

  .answer {
    padding: 13px 15px;
    color: var(--text);
    font-size: 14px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .answer.error { color: var(--danger); }
  .answer .err-line { color: var(--danger); }
  .answer code {
    background: rgba(0,0,0,0.4);
    padding: 1px 6px;
    border-radius: 4px;
    font-family: 'SF Mono', 'JetBrains Mono', 'Consolas', monospace;
    font-size: 12.5px;
    color: var(--code);
  }

  .typing-cursor {
    display: inline-block;
    width: 7px;
    height: 15px;
    background: var(--accent);
    margin-left: 3px;
    vertical-align: -2px;
    border-radius: 1px;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ── Empty state ──────────────────────────────── */
  .empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    text-align: center;
    gap: 14px;
  }
  .empty .mark {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--accent) 0%, #7c5cff 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    box-shadow: 0 8px 28px rgba(79, 140, 255, 0.28);
  }
  .empty .mark svg { width: 28px; height: 28px; }

  .empty h2 {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  .empty p {
    font-size: 13px;
    color: var(--text-dim);
    max-width: 340px;
    line-height: 1.65;
  }

  .chips {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 8px;
  }
  .chip {
    padding: 7px 12px;
    border-radius: var(--radius-sm);
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--text-dim);
    font-size: 12px;
    font-family: 'SF Mono', 'Consolas', monospace;
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
  }
  .chip:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-soft);
  }

  /* ── Composer ─────────────────────────────────── */
  .composer {
    padding: 12px 16px 16px;
    background: var(--surface);
    border-top: 1px solid var(--line);
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }

  .composer-wrap {
    flex: 1;
    position: relative;
    background: var(--surface-2);
    border: 1px solid var(--line-2);
    border-radius: var(--radius);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .composer-wrap:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .composer textarea {
    width: 100%;
    background: transparent;
    border: none;
    color: var(--text);
    padding: 11px 14px;
    font-size: 14px;
    font-family: inherit;
    resize: none;
    outline: none;
    max-height: 160px;
    line-height: 1.55;
    display: block;
  }
  .composer textarea::placeholder { color: var(--text-mute); }

  .send {
    width: 42px;
    height: 42px;
    border-radius: var(--radius);
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
    box-shadow: 0 4px 14px rgba(79, 140, 255, 0.3);
  }
  .send:hover:not(:disabled) { background: var(--accent-2); transform: translateY(-1px); box-shadow: 0 6px 18px rgba(79, 140, 255, 0.35); }
  .send:active:not(:disabled) { transform: translateY(0); }
  .send:disabled { background: var(--line-2); color: var(--text-mute); box-shadow: none; cursor: not-allowed; }
  .send svg { width: 17px; height: 17px; }

  /* ── Footer ───────────────────────────────────── */
  footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 20px;
    border-top: 1px solid var(--line);
    background: var(--surface);
    font-size: 11px;
    color: var(--text-mute);
    gap: 12px;
    letter-spacing: 0.01em;
  }
  footer .left, footer .right {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  footer .left  { text-align: left; }
  footer .right { text-align: right; }
  footer b { color: var(--text-dim); font-weight: 500; }

  /* ── Responsive ───────────────────────────────── */
  @media (max-width: 600px) {
    .app { border-left: none; border-right: none; }
    header { padding: 12px 14px; }
    .chat { padding: 18px 14px 12px; }
    .composer { padding: 10px 12px 14px; }
    footer { padding: 8px 14px; font-size: 10px; }
    .logo-text .subtitle { display: none; }
  }
</style>
</head>

        cvn: applyCase(word, other),

      cqn: applyCase(word, cqn),
      cvn: applyCase(word, originalCode),

  function convertText(input, mode = "cqn") {
    if (!["cqn","cvn","cvss"].includes(mode)) {

      result.cqn.push(converted.cqn);
      result.cvn.push(converted.cvn);
      result.cvss.push(converted.cvss);

    }
    return Object.freeze({
      version: VERSION,
      baseRows: BASE_ROWS.length,
      totalPatchEntries: PATCH_54.length + PATCH_56.length,
      ambiguityGroups: groups,
      explicitCanonicalPolicies: Object.keys(CANONICAL_PREFERRED).length,
      criticalCollisionGroups: Object.keys(CRITICAL_COLLISIONS).length,
      maxCandidateCount: maxC,

  }

  function selfTest() {
    const tests = [
      ["toiy","tôi"],["iwy","yêu"],["vidf","việt"],["ily","yên"],["idb","yết"],
      ["tizb","tiếng"],["wizy","nghiêng"],["ses","sẽ"],["hed","hề"],

    for (const [code, expected] of tests) {
      const actual = convertText(code, "cvss").cqn;
      if (actual !== expected) failures.push({ code, expected, actual });
    }
    return Object.freeze({ ok: failures.length === 0, tests: tests.length, failures });
  }

  return Object.freeze({
    VERSION, convert: convertText,
    fromCqn: (i) => convertText(i, "cqn"),
    fromCvn: (i) => convertText(i, "cvn"),
    fromCvss: (i) => convertText(i, "cvss"),
    audit: () => audit(),
    selfTest
  });
});

          <circle cx="12" cy="7" r="4"/>
        </svg>
        Bạn
      </div>
      <div class="bubble"></div>`;
    el.querySelector(".bubble").textContent = text;
    chatEl.appendChild(el);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function addAssistantShell() {
    hideEmpty();
    const el = document.createElement("div");
    el.className = "msg assistant";
    el.innerHTML = `
      <div class="head">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="10" rx="2"/>
          <circle cx="12" cy="16" r="2"/>
          <path d="M12 11V7"/>
          <circle cx="12" cy="5" r="2"/>
        </svg>
        AI
      </div>
      <div class="bubble">
        <details class="reason streaming" open>
          <summary>
            <svg class="brain" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9.5 2A2.5 2.5 0 0 0 7 4.5v.5a3 3 0 0 0-2 2.83V10a3 3 0 0 0 1 2.24V14a3 3 0 0 0 3 3h1v2a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2v-2h1a3 3 0 0 0 3-3v-1.76A3 3 0 0 0 19 10V7.83A3 3 0 0 0 17 5v-.5A2.5 2.5 0 0 0 14.5 2h-5z"/>
              <path d="M9 7h1"/>
              <path d="M14 7h1"/>
              <path d="M9.5 11h5"/>
              <path d="M12 11v4"/>
            </svg>
            <span class="label">Reasoning · CVNSS4.0</span>
            <span class="status">đang suy luận</span>
            <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"/>
            </svg>
          </summary>
          <pre></pre>
        </details>
        <div class="answer"><span class="typing-cursor"></span></div>
      </div>`;
    chatEl.appendChild(el);
    chatEl.scrollTop = chatEl.scrollHeight;
    return {
      root:   el,
      reason: el.querySelector(".reason"),
      status: el.querySelector(".status"),
      pre:    el.querySelector(".reason pre"),
      answer: el.querySelector(".answer")
    };
  }

  // ── API stream ────────────────────────────────────────────────
  function extractReasoning(chunk) {
    const d = chunk.choices?.[0]?.delta || {};
    if (typeof d.reasoning === "string" && d.reasoning) return d.reasoning;
    if (typeof d.reasoning_content === "string" && d.reasoning_content) return d.reasoning_content;
    if (Array.isArray(d.reasoning_details)) {
      return d.reasoning_details.map(x => x.text || x.content || "").join("");
    }
    const m = chunk.choices?.[0]?.message;
    if (m) {
      if (typeof m.reasoning === "string" && m.reasoning) return m.reasoning;
      if (typeof m.reasoning_content === "string" && m.reasoning_content) return m.reasoning_content;
      if (Array.isArray(m.reasoning_details)) {
        return m.reasoning_details.map(x => x.text || x.content || "").join("");
      }
    }
    return "";
  }

  async function callApi(ui, signal) {
    const res = await fetch(API_URL, {
      method: "POST",
      signal,
      headers: HEADERS,
      body: JSON.stringify({
        model: MODEL,
        stream: true,
        reasoning: { enabled: true },
        max_tokens: MAX_TOK,
        messages: history
      })
    });

    if (!res.ok || !res.body) {
      const t = await res.text().catch(() => "");
      throw new Error(`HTTP ${res.status} ${t}`);
    }

    const reader  = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer    = "";
    let rawReason = "";
    let content   = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split(/\r?\n/);
      buffer = lines.pop() || "";

      for (const line of lines) {
        const t = line.trim();
        if (!t.startsWith("data:")) continue;
        const data = t.slice(5).trim();
        if (data === "[DONE]") continue;

        try {
          const json = JSON.parse(data);
          const delta = json.choices?.[0]?.delta;
          if (!delta) continue;

          if (delta.content) {
            content += delta.content;
            ui.answer.textContent = content;
          }

          const rc = extractReasoning(json);
          if (rc) {
            rawReason += rc;
            ui.pre.textContent = enc(rawReason);
          }
        } catch (_) { /* skip bad line */ }
      }
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    if (!content) content = "(Không có phản hồi)";
    ui.answer.textContent = content;
    ui.reason.classList.remove("streaming");
    ui.reason.classList.add("done");
    ui.status.textContent = "hoàn tất";
    return content;
  }

  // ── Offline converter ─────────────────────────────────────────
  function runOffline(ui, text, reason) {
    const code = isCode(text);
    const encoded = code ? text : enc(text);
    const decoded = code ? dec(text) : text;

    const reasonLines = [
      "// OFFLINE MODE",
      "// Lý do: " + reason,
      "",
      code ? "// Input  (mã CVNSS4.0): " + text
           : "// Input  (tiếng Việt):  " + text,
      code ? "// Output (tiếng Việt):  " + (decoded || "?")
           : "// Output (mã CVNSS4.0): " + (encoded || "?")
    ];
    ui.pre.textContent = reasonLines.join("\n");

    const answerLines = code
      ? ["Đã giải mã mã CVNSS4.0 thành tiếng Việt:", "", decoded || "(không giải mã được)"]
      : ["Đã mã hoá tiếng Việt thành CVNSS4.0:", "", encoded || "(không mã hoá được)"];
    ui.answer.textContent = answerLines.join("\n");
    ui.reason.classList.remove("streaming");
    ui.reason.classList.add("done");
    ui.status.textContent = "offline";
  }

  function runOfflineError(ui, errMsg) {
    ui.pre.textContent = "// API ERROR\n// " + errMsg;
    ui.answer.innerHTML = `<span class="err-line">⚠️ Không kết nối được API.</span>\n\n<code>${errMsg}</code>`;
    ui.reason.classList.remove("streaming");
    ui.reason.classList.add("done");
    ui.status.textContent = "lỗi";
  }

  // ── Main ──────────────────────────────────────────────────────
  async function handleSend() {
    if (busy) return;
    const text = inputEl.value.trim();
    if (!text) return;

    addUserMessage(text);
    inputEl.value = "";
    inputEl.style.height = "auto";
    inputEl.focus();

    const ui = addAssistantShell();
    busy = true;
    sendBtn.disabled = true;

    if (mode === "offline") {
      runOffline(ui, text, "Chế độ Offline được chọn.");
      busy = false; sendBtn.disabled = false;
      return;
    }

    history.push({ role: "user", content: text });

    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), TIMEOUT);

    try {
      const content = await callApi(ui, controller.signal);
      clearTimeout(timer);
      history.push({ role: "assistant", content });
    } catch (err) {
      clearTimeout(timer);
      const isTimeout = err.name === "AbortError";
      const msg = isTimeout ? `Timeout ${TIMEOUT / 1000}s` : String(err.message || err);

      if (mode === "api") {
        runOfflineError(ui, msg);
      } else {
        runOffline(ui, text, "API lỗi → tự động chuyển Offline. (" + msg + ")");
      }
    } finally {
      busy = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  // ── Debug ─────────────────────────────────────────────────────
  window.__cvnss = { CVN, enc, dec, selfTest: CVN.selfTest };
  console.log("CVNSS4.0 ready.", CVN.audit());
})();
</script>
